name: easygen-app

services:
  mongo:
    image: mongo:8.0@sha256:6657bf2413fefc5be649390318f5b4cd7328e982722f8ce2ac6dfa6f0a42cb03
    restart: unless-stopped
    command: [mongod, --bind_ip_all]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [private]

  app:
    build: .
    image: easygen-auth:local
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://' + process.env.HOST + ':' + process.env.PORT + '/').then((response) => process.exit(response.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/easygen
      SESSION_SECRET: ${SESSION_SECRET:?Set a generated SESSION_SECRET in .env}
      HOST: ${DOCKER_APP_HOST:?Set a private DOCKER_APP_HOST in .env}
      PORT: "3000"
      TRUSTED_PROXY_CIDRS: ""
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      private:
        ipv4_address: ${DOCKER_APP_HOST:?Set a private DOCKER_APP_HOST in .env}

networks:
  private:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_APP_SUBNET:?Set a private DOCKER_APP_SUBNET in .env}

volumes:
  mongo-data:
